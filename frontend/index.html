<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dashboard</title>
    <!-- Tabulator 6.3.0 (pinned) -->
    <link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <!-- Header bar -->
    <header id="header">
        <div class="header-left">
            <h1>📊 Trading Dashboard</h1>
            <span class="env-badge" id="env-badge">--</span>
            <span class="paper-badge" id="paper-badge">--</span>
        </div>
        <div class="header-right">
            <button id="run-now-btn" title="Trigger a full trading cycle" disabled>▶ Run Now</button>
            <button id="run-session-btn" title="Run a session using the latest backtest data (skips optimization)"
                disabled>⚡ Run Session</button>
            <div class="status-row">
                <span class="label">Last Run:</span>
                <span class="status-dot" id="status-dot"></span>
                <span id="last-run-status">--</span>
            </div>
            <div class="status-row">
                <span class="label">Duration:</span>
                <span id="last-run-duration">--</span>
            </div>
            <div class="status-row">
                <span class="label">Strategies:</span>
                <span id="backtest-count">--</span>
            </div>
            <div class="status-row" id="refresh-indicator">
                <span class="label">Updated:</span>
                <span id="last-refresh">--</span>
            </div>
        </div>
    </header>

    <!-- Tab bar -->
    <div id="tab-bar">
        <button class="tab-btn active" data-tab="positions">Positions</button>
        <button class="tab-btn" data-tab="activity">Run Activity</button>
        <button class="tab-btn" data-tab="jobs">Jobs</button>
        <button class="tab-btn" data-tab="database">Database</button>
    </div>

    <!-- Positions tab -->
    <section id="tab-positions" class="tab-panel active">
        <!-- Filter bar -->
        <div id="filter-bar">
            <button class="filter-btn active" data-status="all">All Positions</button>
            <button class="filter-btn" data-status="open">Open Only</button>
            <button class="filter-btn" data-status="closed">Closed Only</button>
            <span id="position-count" class="count-label"></span>
        </div>

        <!-- Positions table -->
        <div id="positions-table"></div>
    </section>

    <!-- Jobs tab (Phase 4: background job progress) -->
    <section id="tab-jobs" class="tab-panel">
        <div id="jobs-panel">
            <div id="active-job-card" class="job-card" hidden>
                <div class="job-card-header">
                    <span id="job-kind" class="job-kind">—</span>
                    <span id="job-status" class="job-status">—</span>
                </div>
                <div class="job-progress-track">
                    <div id="job-progress-bar" class="job-progress-bar" style="width:0%"></div>
                </div>
                <div class="job-card-footer">
                    <span id="job-message">—</span>
                    <span id="job-pct">0%</span>
                </div>
            </div>
            <h2 class="panel-subheading">Recent jobs</h2>
            <div id="jobs-table"></div>
        </div>
    </section>

    <!-- Database tab -->
    <section id="tab-database" class="tab-panel">
        <div id="db-toolbar">
            <label for="db-table-select">Table</label>
            <select id="db-table-select"></select>
            <button id="db-refresh-btn" title="Refresh current table">↻ Refresh</button>
            <span id="db-row-count" class="count-label"></span>
            <span id="db-error" class="db-error"></span>
        </div>
        <div id="db-table-container"></div>
        <div id="db-pager">
            <button id="db-prev-btn" disabled>← Prev</button>
            <span id="db-page-label">—</span>
            <button id="db-next-btn" disabled>Next →</button>
        </div>
    </section>

    <!-- Run Activity tab -->
    <section id="tab-activity" class="tab-panel">
        <div id="activity-summary" class="activity-grid">
            <div class="metric">
                <span class="metric-value" id="m-lines">—</span>
                <span class="metric-label">Backtests run</span>
            </div>
            <div class="metric">
                <span class="metric-value" id="m-opportunities">—</span>
                <span class="metric-label">Buy signals</span>
            </div>
            <div class="metric">
                <span class="metric-value" id="m-orders">—</span>
                <span class="metric-label">Orders placed</span>
            </div>
            <div class="metric">
                <span class="metric-value" id="m-new">—</span>
                <span class="metric-label">New positions</span>
            </div>
            <div class="metric">
                <span class="metric-value" id="m-exits">—</span>
                <span class="metric-label">Exits</span>
            </div>
        </div>
        <h2 id="activity-subheading" class="panel-subheading">Orders placed this session</h2>
        <div id="orders-table"></div>
        <div id="activity-errors" class="db-error"></div>
    </section>

    <script src="/static/dashboard.js"></script>
</body>

</html>
